name: Electron macOS builds

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-electron-macos:
    name: Build Electron ${{ matrix.build-group }}
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            build-group: electron-darwin-x64-2

          - arch: arm64
            build-group: electron-darwin-arm64

    env:
      ELECTRON_TARGET: 32.1.2
      BUILD_GROUP: ${{ matrix.build-group }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build from source via node-gyp (Electron headers)
        run: |
          npx node-gyp rebuild \
            --target="$ELECTRON_TARGET" \
            --arch="${{ matrix.arch }}" \
            --dist-url=https://electronjs.org/headers \

      - name: Find built .node files
        run: find ./build -name "*.node" 2>/dev/null || echo "Nothing found"

      - name: Copy prebuilds
        run: |
          mkdir -p "prebuilds/$BUILD_GROUP"
          cp build/Release/*.node "prebuilds/$BUILD_GROUP/"
          echo "=== Result ==="
          file "prebuilds/$BUILD_GROUP/"*.node

      - name: Upload prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.build-group }}
          path: prebuilds/**
          if-no-files-found: error
